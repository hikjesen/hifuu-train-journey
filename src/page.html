<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#151b1a">
<title>秘封的列车旅行 · 旭岳秋景</title>
<style>
:root{color-scheme:dark;--paper:#f0e8d6;--light:#dac5a1;--gold:#d5ac76;--muted:#a39d8f;--ink:#151a19;--line:#3c4038;--serif:"Noto Serif CJK SC","Songti SC","Yu Mincho","SimSun",Georgia,serif;--sans:"Noto Sans CJK SC","Microsoft YaHei","Hiragino Sans GB",Arial,sans-serif}
*{box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;margin:0}body{background:var(--ink);font-family:var(--sans);color:var(--paper);font-weight:400}
button,input{font:inherit}button{color:inherit;border:0;background:none;cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid #e8c48d;outline-offset:4px}
#film{height:100%;height:100dvh;display:grid;grid-template-rows:74px minmax(0,1fr) 102px;isolation:isolate;background:linear-gradient(118deg,#1b201f,#141817 63%)}
.header{display:flex;align-items:center;justify-content:space-between;padding:0 clamp(18px,3.2vw,64px);border-bottom:1px solid var(--line);gap:12px;z-index:2}
.brand,.side,.place,.navbtn,.transport,.controls,.chapterLine,.counter,.timeLine,.legend{display:flex;align-items:center}
.brand{gap:14px;min-width:0}.seal{width:42px;height:42px;color:var(--gold);flex-shrink:0}
.brand h1{font-family:var(--serif);font-size:clamp(19px,1.55vw,27px);letter-spacing:.12em;line-height:1.25;font-weight:600;margin:0;white-space:nowrap}.latin,.eyebrow,.counter,.coords,.panelTime{font-family:Georgia,"Times New Roman",serif;font-variant-numeric:tabular-nums}
.latin{font-size:9px;letter-spacing:.27em;color:#beb29b;margin-top:4px}.side{gap:24px}.place{gap:10px;font-size:12px;letter-spacing:.08em;color:#d1cbbb}.place i{width:3px;height:3px;background:var(--gold);border-radius:50%}.place canvas{color:var(--gold)}
.navbtn{gap:8px;justify-content:center;border:1px solid #55574b;padding:8px 13px;border-radius:4px;font-size:12px;letter-spacing:.07em;color:#ede4d2}.navbtn:hover,.navbtn[aria-expanded=true]{background:#343833;border-color:#8b816c}
.icon{height:20px;width:20px;display:block;flex-shrink:0}.navbtn .icon,.place .icon{height:16px;width:16px}
.stage{position:relative;min-height:0;overflow:hidden;background:#241f21;touch-action:none}
#view,#fallback{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}.dragging #view,.dragging #fallback{cursor:grabbing}#fallback[hidden]{display:none}
#loading{position:absolute;inset:0;display:grid;place-items:center;background:#202526;color:#ded1b6;letter-spacing:.16em;font-size:13px;z-index:2}
#loading[hidden]{display:none}
.stage:after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 46px 2px #1b161b2b}
.legend{position:absolute;left:50%;bottom:15px;transform:translateX(-50%);font-size:11px;letter-spacing:.06em;gap:9px;color:#f3e9d7;white-space:nowrap;text-shadow:0 1px 3px #29190e;pointer-events:none;transition:opacity .65s;background:#1b201d99;border:1px solid #e6d8b42c;padding:6px 12px;border-radius:18px}.legend .icon{width:14px;height:14px}.legend.dim{opacity:0}
.deck{padding:11px clamp(18px,3.2vw,64px) 12px;border-top:1px solid #4d493c;position:relative;z-index:2;display:flex;flex-direction:column;justify-content:center;gap:9px}
.transport{justify-content:space-between;gap:18px;min-height:38px}.chapterLine{gap:15px;min-width:0}.chapterNo{display:flex;align-items:center;justify-content:center;width:35px;height:27px;border:1px solid #756b56;color:#d6b888;border-radius:2px;font:italic 18px Georgia,serif}
.eyebrow{font-size:9px;letter-spacing:.20em;color:#ae9b79;margin:0 0 2px;white-space:nowrap}.chapterName{font-family:var(--serif);font-size:clamp(16px,1.4vw,23px);letter-spacing:.10em;font-weight:500;margin:0;line-height:1.3}
.controls{gap:9px}.counter{color:#d1c5af;font-size:13px;letter-spacing:.07em;gap:7px;margin-right:12px}.counter small{font-family:Georgia,serif;font-size:12px;color:#a29f93}.ctrl{height:34px;width:34px;display:grid;place-items:center;border-radius:50%;color:#d9d4c7}.ctrl:hover,.ctrl[aria-pressed=true]{background:#353b36;color:var(--paper)}
.ctrl.primary{background:var(--paper);color:#232724;width:37px;height:37px}.ctrl.primary:hover{background:#ffedd0}.primary .icon{width:17px;height:17px}
.controls .divider{width:1px;height:18px;background:#4a4c40;margin:0 3px}
.timeLine{height:16px;position:relative;isolation:isolate;--progress:5.5%}.track,.fill{pointer-events:none;height:2px;position:absolute;inset-inline:0;top:7px;background:#484d44}
.fill{right:auto;width:var(--progress);background:#cfb183}.ticks{position:absolute;inset:0;pointer-events:none}.ticks i{position:absolute;top:5px;width:1px;height:6px;background:#88836f}.dot{position:absolute;left:var(--progress);top:4px;width:8px;height:8px;border-radius:100%;background:#fae3b9;transform:translateX(-50%);pointer-events:none;box-shadow:0 0 0 2px #252922}
#seek{position:absolute;inset:0;width:100%;height:100%;margin:0;cursor:pointer;background:transparent;opacity:0}.timeLine:focus-within{outline:1px solid var(--gold);outline-offset:4px}
.drawer{position:absolute;z-index:5;right:clamp(13px,3.2vw,64px);top:12px;width:min(354px,calc(100% - 26px));background:#1c2321f5;border:1px solid #686552;box-shadow:0 12px 60px #0008;border-radius:6px;padding:18px 19px 14px;max-height:calc(100% - 24px);overflow:auto;color:#eee5d2;touch-action:pan-y}.drawer[hidden]{display:none}
.panelHead{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #474b40;padding-bottom:13px}.panelHead h2{font:500 19px var(--serif);letter-spacing:.12em;margin:0}.panelHead button{width:28px;height:28px;display:grid;place-items:center;color:#c3b9a2}.stops{display:grid;padding:6px 0}.stop{display:flex;align-items:center;gap:13px;text-align:left;position:relative;padding:10px 5px;color:#c9c4b5}.stop:hover,.stop[aria-current=true]{color:#f6dfba;background:#c8b4890d}.stop i{width:7px;height:7px;border:1px solid #9f947d;border-radius:100%;flex-shrink:0}.stop[aria-current=true] i{background:#d8af75;border-color:#d8af75}.stop strong{font:500 15px var(--serif);letter-spacing:.08em}.panelTime{margin-left:auto;color:#aaa08a;font-size:12px}.panelFoot{display:flex;gap:8px;border-top:1px solid #474b40;padding-top:12px;font-size:11px;color:#bdb7a8;align-items:center;line-height:1.6}
#blackout{position:fixed;inset:0;z-index:20;background:black;opacity:0;pointer-events:none}.imm #film{grid-template-rows:0 minmax(0,1fr) 0}.imm .header,.imm .deck{visibility:hidden;overflow:hidden;padding:0}.imm .legend{display:none}#restore{position:absolute;right:16px;top:14px;z-index:3;opacity:0;pointer-events:none;background:#1d231fb3;color:var(--paper);border:1px solid #e9ddbc40;transition:opacity .35s}.imm #restore{opacity:.72;pointer-events:auto}.imm #restore.fade{opacity:.09}.imm #restore:hover,.imm #restore:focus-visible{opacity:1}
@media(max-width:740px){#film{grid-template-rows:60px minmax(0,1fr) 86px}.header{padding-inline:16px}.brand{gap:9px}.seal{width:34px;height:34px}.brand h1{font-size:18px}.latin{font-size:8px;letter-spacing:.21em}.side{gap:12px}.place{display:none}.navbtn{padding:7px 10px}.deck{padding:8px 16px;gap:5px}.controls{gap:2px}.counter{margin-right:5px;font-size:12px;gap:4px}.counter small{font-size:10px}.ctrl{width:30px;height:30px}.ctrl.primary{width:32px;height:32px}.chapterLine{gap:8px}.chapterNo{width:27px;height:24px;font-size:15px}.eyebrow{font-size:8px;letter-spacing:.12em}.chapterName{font-size:15px}.legend{font-size:10px;bottom:10px}.controls .divider{margin:0 2px}.brand .latin{margin-top:2px}}
@media(max-height:520px) and (orientation:landscape){#film{grid-template-rows:44px minmax(0,1fr) 64px}.header{padding-inline:18px}.brand h1{font-size:17px}.seal{height:30px;width:30px}.latin{display:none}.deck{padding:4px 18px;gap:0}.chapterName{font-size:15px}.legend{bottom:5px}}
@media(max-width:425px){.chapterNo{display:none}.controls .divider{display:none}.ctrl{width:29px}.counter{margin-right:3px}.transport{gap:7px}.navbtn{font-size:11px}}
</style>
</head>
<body>
<main id="film">
<header class="header">
<div class="brand"><canvas class="seal" data-icon="seal" aria-hidden="true"></canvas><div><h1>秘封的列车旅行</h1><div class="latin" lang="en">HIFUU RAIL JOURNAL</div></div></div>
<div class="side"><div class="place"><canvas class="icon" data-icon="sun" aria-hidden="true"></canvas><span>北海道</span><i></i><span>大雪山旭岳</span></div><button id="route" class="navbtn" aria-expanded="false" aria-controls="journal"><canvas class="icon" data-icon="book" aria-hidden="true"></canvas>行程簿</button></div>
</header>
<section class="stage" id="stage" aria-label="秋日列车的交互式全景" tabindex="0">
<canvas id="view" aria-label="从车厢看向北海道旭岳的秋日黄昏"></canvas><canvas id="fallback" hidden aria-hidden="true"></canvas>
<div id="loading" role="status">列车即将发车…</div>
<div class="legend" id="legend"><canvas class="icon" data-icon="drag" aria-hidden="true"></canvas><span id="hint">拖动环顾车厢 · 滚轮变焦</span></div>
<button id="restore" class="ctrl" aria-label="显示放映控件" title="显示放映控件"><canvas class="icon" data-icon="restore" aria-hidden="true"></canvas></button>
<aside id="journal" class="drawer" hidden aria-label="行程簿"><div class="panelHead"><h2>行程簿</h2><button id="close" title="收起行程簿" aria-label="收起行程簿"><canvas class="icon" data-icon="x" aria-hidden="true"></canvas></button></div><div class="stops" id="stops"></div><div class="panelFoot">全程 3 分 36 秒。点击沿途景段可直接抵达。</div></aside>
</section>
<footer class="deck"><div class="transport"><div class="chapterLine"><span class="chapterNo" id="chapterNo">01</span><div><div class="eyebrow" id="chapterEn" lang="en">HARVEST BASIN</div><h2 class="chapterName" id="chapterName">金色稻原</h2></div></div><div class="controls">
<div class="counter"><span id="clock">00:12</span><small>/</small><small>03:36</small></div>
<button class="ctrl primary" id="play" title="暂停 · 空格" aria-label="暂停"><canvas class="icon" data-icon="pause" aria-hidden="true"></canvas></button>
<button class="ctrl" id="sound" title="开启列车声" aria-label="开启列车声" aria-pressed="false"><canvas class="icon" data-icon="mute" aria-hidden="true"></canvas></button>
<span class="divider"></span><button class="ctrl" id="full" title="全屏观景 · F" aria-label="全屏观景"><canvas class="icon" data-icon="full" aria-hidden="true"></canvas></button>
</div></div>
<div class="timeLine" id="timeLine"><div class="track"></div><div class="fill"></div><div class="ticks" id="ticks"></div><div class="dot"></div><input id="seek" type="range" min="0" max="215.99" step="0.05" value="12" aria-label="旅程进度"></div>
</footer>
</main><div id="blackout" aria-hidden="true"></div>
<img id="panorama" alt="" hidden src="@@PANORAMA@@">
<img id="sky-layers" alt="" hidden src="@@SKY_LAYERS@@">
<img id="cabin" alt="" hidden src="@@CABIN@@">
<script>
'use strict';
/*@@SOURCES@@*/
</script>
</body></html>
