name: Bake the experimental sky

on:
  push:
    branches: [experiment/dream-sky]
    paths:
      - '.github/workflows/bake-dream-sky.yml'
      - 'tools/generate_panorama.cpp'

permissions:
  contents: write

jobs:
  panorama:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Render the panorama
        shell: bash
        run: |
          set -euo pipefail
          c++ -std=c++17 -O3 -fopenmp -Wall -Wextra tools/generate_panorama.cpp -o "$RUNNER_TEMP/hifuu-env"
          OMP_NUM_THREADS="$(nproc)" "$RUNNER_TEMP/hifuu-env" 7168 "$RUNNER_TEMP/asahidake.ppm"
          if command -v magick >/dev/null; then
            encoder=magick
          else
            if ! command -v convert >/dev/null; then
              sudo apt-get update -qq
              sudo apt-get install -y imagemagick
            fi
            encoder=convert
          fi
          "$encoder" "$RUNNER_TEMP/asahidake.ppm" -sampling-factor 1x1 -quality 92 src/horizon.jpg
          python3 tools/assemble.py
          sha256sum src/horizon.jpg dist/index.html
      - name: Save the verified outputs on the experimental branch
        shell: bash
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = refs/heads/experiment/dream-sky ]
          git add src/horizon.jpg dist/index.html
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Bake the dream sky into the standalone film"
          git push origin HEAD:refs/heads/experiment/dream-sky
