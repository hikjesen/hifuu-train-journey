name: Compare the experimental sky

on:
  push:
    branches: [experiment/dream-sky]
    paths: ['.github/workflows/compare-dream-sky.yml']

permissions:
  contents: write

jobs:
  comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Render two frames through the window
        shell: bash
        run: |
          set -euo pipefail
          git show ead91c14afd284ddf56bcd3d6f464e47f6618071:src/horizon.jpg > "$RUNNER_TEMP/original-sky.jpg"
          npm install --prefix "$RUNNER_TEMP/compare" --no-audit --no-fund @napi-rs/canvas@0.1.80
          cat > "$RUNNER_TEMP/compare/frame.cjs" <<'JAVASCRIPT'
          const fs = require('node:fs');
          const path = require('node:path');
          const { createCanvas, loadImage } = require('@napi-rs/canvas');

          async function render() {
            const src = path.resolve('src');
            const scripts = ['geometry', 'renderer', 'countryside', 'landlight', 'tunnel', 'software'];
            const source = scripts.map(name => fs.readFileSync(path.join(src, name + '.js'), 'utf8')).join('\n');
            const cabin = await loadImage(path.join(src, 'cabin.webp'));
            const document = { createElement() { return createCanvas(1, 1); } };
            const SoftwareJourney = new Function('document', 'byId', 'performance', source + '\nreturn SoftwareJourney;')(
              document, id => id === 'cabin' ? cabin : null, performance
            );
            const views = [
              ['Original twilight', path.join(process.env.RUNNER_TEMP, 'original-sky.jpg')],
              ['Dream sky', path.join(src, 'horizon.jpg')]
            ];
            const cropHeight = 262, labelHeight = 43, width = 1090;
            const compare = createCanvas(width, 2 * (cropHeight + labelHeight));
            const ctx = compare.getContext('2d');
            ctx.fillStyle = '#1c211f';
            ctx.fillRect(0, 0, compare.width, compare.height);
            for (const [row, [label, image]] of views.entries()) {
              const canvas = createCanvas(width, 607);
              const world = new SoftwareJourney(canvas, await loadImage(image));
              world.draw({ t: 13.6, playing: false, fov: 57, yaw: 0, pitch: 0 }, 1366, 760, 14600);
              const y = row * (cropHeight + labelHeight);
              ctx.fillStyle = '#f0e7d7';
              ctx.font = '22px serif';
              ctx.textAlign = 'left';
              ctx.fillText(label, 36, y + 29);
              ctx.fillStyle = '#bdb29d';
              ctx.font = '14px sans-serif';
              ctx.textAlign = 'right';
              ctx.fillText('ASAHIDAKE    /    00:13.6', width - 36, y + 27);
              ctx.drawImage(canvas, 0, 0, canvas.width, cropHeight, 0, y + labelHeight, width, cropHeight);
            }
            fs.mkdirSync('preview', { recursive: true });
            fs.writeFileSync('preview/sky-comparison.jpg', await compare.encode('jpeg', 93));
          }
          render().catch(error => { console.error(error); process.exitCode = 1; });
          JAVASCRIPT
          node "$RUNNER_TEMP/compare/frame.cjs"
      - name: Save the comparison
        shell: bash
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = refs/heads/experiment/dream-sky ]
          git add preview/sky-comparison.jpg
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Compare both twilight skies from the opening seat"
          git push origin HEAD:refs/heads/experiment/dream-sky
